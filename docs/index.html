<!doctype html>
<html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voedselwijs</title><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#17352a;--paper:#f8f3e8;--green:#247255;--sun:#f5bf42;--bad:#91463d}*{box-sizing:border-box}body{margin:0;background:#dce7d5;color:var(--ink);font-family:'DM Mono',monospace}.app{max-width:430px;min-height:100vh;margin:auto;padding:28px 21px 95px;background:var(--paper)}header{display:flex;justify-content:space-between;align-items:center}.logo,h1,h2,h3{font-family:Fraunces,serif}.logo{font-size:24px;font-weight:700}.profile{padding:7px 9px;border-radius:99px;background:#d8efb2;font-size:9px}h1{font-size:39px;line-height:1;margin:40px 0 12px}.intro,.small{font-size:11px;line-height:1.65}.camera{display:block;position:relative;height:250px;margin:26px 0 15px;padding-top:88px;overflow:hidden;border:1px dashed #638a6d;border-radius:30px;background:linear-gradient(150deg,#d6efad,#a8dabe);color:#fff;text-align:center;font-size:45px}.camera small{display:block;margin-top:11px;font-size:9px}.camera input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.photo{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.progress,.error{display:none;margin-top:14px;padding:12px;border-radius:14px;font-size:10px;line-height:1.55}.progress{background:#edf4dd}.error{background:#f9ded8;color:#75362c}.manual{display:flex;gap:8px;margin-top:15px}.manual input{min-width:0;flex:1;padding:12px;border:1px solid #c2d1bc;border-radius:12px;background:#fff;font:11px 'DM Mono',monospace}.manual button,.again{border:0;border-radius:12px;background:var(--green);color:white;padding:0 13px;font:10px 'DM Mono',monospace}.result{display:none}.eyebrow{margin-top:35px;color:var(--green);font-size:9px;letter-spacing:.1em}.product{display:flex;gap:13px;align-items:center;margin-top:11px}.product img,.fallback{width:78px;height:78px;object-fit:contain;border-radius:16px;background:white}.fallback{display:grid;place-items:center;font-size:29px}.product h2{margin:0;font-size:25px;line-height:1.05}.product p,.ingredients{font-size:10px;line-height:1.6}.verdict{margin-top:20px;padding:19px;border-radius:24px;background:var(--ink);color:#fff}.verdict small{color:var(--sun);font-size:9px}.verdict h3{margin:9px 0;font-size:23px;line-height:1.06}.verdict p{font-size:10px;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.chip{padding:7px 9px;border-radius:99px;background:#315b48;font-size:9px}.warn{background:var(--bad)}.card{margin-top:17px;padding:16px;border:1px solid #d7dfcb;border-radius:18px}.card h3{margin:0 0 10px;font-size:18px}.card dl{display:grid;grid-template-columns:1fr auto;gap:9px;margin:0;font-size:10px}.card dt{opacity:.7}.card dd{margin:0;font-weight:500}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:76px;display:flex;justify-content:space-around;align-items:center;background:#fffaf0;border-top:1px solid #e2e8d8;font-size:10px}.active{color:var(--green);font-weight:bold}</style></head><body><main class="app"><header><span class="logo">voedselwijs</span><span class="profile">jouw profiel</span></header><section id="start"><h1>Wat zit er<br>eigenlijk in?</h1><p class="intro">Fotografeer de barcode of de ingrediëntenlijst. We proberen altijd eerst de barcode, daarna de ingrediënten op de foto.</p><label class="camera"><img id="photo" class="photo" alt="Gekozen productfoto"><span id="cameraText">⌁<small>FOTOGRAFEER ETIKET OF BARCODE</small></span><input id="cameraInput" type="file" accept="image/*" capture="environment"></label><div id="progress" class="progress"></div><div class="manual"><input id="barcode" inputmode="numeric" placeholder="Barcode handmatig invoeren"><button id="lookup">Zoek</button></div><p class="small">Profiel: vegetarisch · minder suiker · pinda-allergie.</p><div id="error" class="error"></div></section><section id="result" class="result"><div class="eyebrow" id="source"></div><div class="product" id="product"></div><article class="verdict" id="verdict"></article><article class="card" id="facts"></article><article class="card"><h3>Ingrediënten</h3><p class="ingredients" id="ingredients"></p></article><button class="again" onclick="location.reload()">Nieuw product scannen</button></section></main><nav><span class="active">⌁<br>Scan</span><span>◫<br>Historie</span><span>☻<br>Profiel</span></nav><script>const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s){$('#progress').textContent=s;$('#progress').style.display='block'}function fail(s){$('#error').textContent=s;$('#error').style.display='block';$('#progress').style.display='none'}function eNums(s=''){return [...new Set((s.match(/\bE\s?\d{3,4}[a-z]?\b/gi)||[]).map(x=>x.replace(/\s/g,'').toUpperCase()))]}function finish(name,ingredients,n={},meta={}){const t=ingredients||'',peanut=/pinda|peanut/i.test(t),meat=/vlees|rund|varken|kip|gelatine|vis/i.test(t),sugar=Number(n.sugars_100g??meta.sugar??NaN),ens=eNums(t);let title='Een prima keuze voor jouw profiel.',body='Geen pinda gevonden in de beschikbare productinformatie.',chips=['✓ product geanalyseerd'];if(peanut){title='Niet veilig voor jouw profiel.';body='Dit product bevat pinda of sporen van pinda. Vermijd het vanwege je pinda-allergie.';chips.push('! bevat pinda')}else if(!Number.isNaN(sugar)&&sugar>=10){title='Let op: relatief veel suiker.';body='Dit product bevat '+String(sugar).replace('.',',')+' g suiker per 100 g.';chips.push('! veel suiker')}else{chips.push('✓ geen pinda gedetecteerd');if(!meat)chips.push('✓ vegetarisch')};if(ens.length)chips.push('E-nummers: '+ens.join(', '));$('#source').textContent=meta.source||'PRODUCT HERKEND';$('#product').innerHTML=(meta.image?'<img src="'+esc(meta.image)+'" alt="'+esc(name)+'">':'<div class="fallback">🥫</div>')+'<div><h2>'+esc(name)+'</h2><p>'+esc(meta.subtitle||'Geanalyseerd uit de foto')+'</p></div>';$('#verdict').innerHTML='<small>JOUW PERSOONLIJKE OORDEEL</small><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><div class="chips">'+chips.map(x=>'<span class="chip '+(x[0]=='!'?'warn':'')+'">'+esc(x)+'</span>').join('')+'</div>';$('#facts').innerHTML='<h3>Voedingswaarden</h3><dl><dt>Calorieën</dt><dd>'+esc(n['energy-kcal_100g']??'—')+' kcal / 100 g</dd><dt>Suiker</dt><dd>'+esc(n.sugars_100g??meta.sugar??'—')+' g / 100 g</dd><dt>Zout</dt><dd>'+esc(n.salt_100g??'—')+' g / 100 g</dd><dt>E-nummers</dt><dd>'+esc(ens.length?ens.join(', '):'geen gevonden')+'</dd></dl>';$('#ingredients').textContent=t||'De ingrediënten zijn niet duidelijk genoeg uit de foto gelezen.';$('#start').style.display='none';$('#result').style.display='block'}async function lookup(code){say('Productgegevens worden opgehaald…');const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,image_front_small_url,ingredients_text,nutriments');const j=await r.json();if(j.status!==1)throw Error('Barcode herkend, maar dit product staat niet in de productdatabase.');const p=j.product;finish(p.product_name||'Onbekend product',p.ingredients_text,p.nutriments,{source:'BARCODE HERKEND',image:p.image_front_small_url,subtitle:(p.brands||'')+' · '+code})}async function readIngredients(file){say('Barcode niet herkend. Ingrediënten op de foto worden gelezen…');const out=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text')say('Ingrediënten worden gelezen: '+Math.round(m.progress*100)+'%')}});const raw=out.data.text.replace(/\s+/g,' ').trim();if(raw.length<18)throw Error('De tekst op het etiket is nog niet leesbaar. Maak een scherpere foto van de ingrediëntenlijst.');const hit=raw.match(/(?:ingrediënten|ingredients)[\s:.-]*(.{20,900})/i);const ing=hit?hit[1]:raw;const sm=raw.match(/(?:suikers|sugars)[^\d]{0,18}(\d+[,.]?\d*)/i);finish('Product op basis van etiket',ing,{}, {source:'INGREDIËNTEN UIT FOTO',subtitle:'Barcode niet beschikbaar',sugar:sm?sm[1].replace(',','.'):undefined})}async function scan(file){$('#error').style.display='none';const url=URL.createObjectURL(file);$('#photo').src=url;$('#photo').style.display='block';$('#cameraText').style.display='none';say('Barcode wordt gelezen…');try{const img=new Image;img.src=url;await img.decode();const r=new ZXingBrowser.BrowserMultiFormatReader();const code=(await r.decodeFromImageElement(img)).getText();await lookup(code)}catch(_){try{await readIngredients(file)}catch(e){fail(e.message)}}}$('#cameraInput').onchange=e=>{if(e.target.files[0])scan(e.target.files[0])};$('#lookup').onclick=()=>{const c=$('#barcode').value.trim();if(/^\d{8,14}$/.test(c))lookup(c).catch(e=>fail(e.message));else fail('Vul een barcode met 8 tot 14 cijfers in.')};</script></body></html>
