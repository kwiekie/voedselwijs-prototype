<!doctype html>
<html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voedselwijs</title><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#17352a;--paper:#f8f3e8;--leaf:#d8efb2;--green:#247255;--sun:#f5bf42;--red:#b94d3d}*{box-sizing:border-box}body{margin:0;background:#dce7d5;color:var(--ink);font-family:'DM Mono',monospace}.phone{max-width:430px;min-height:100vh;margin:auto;padding:27px 21px 94px;background:var(--paper)}header{display:flex;justify-content:space-between;align-items:center}.logo,h1,h2,h3{font-family:Fraunces,serif}.logo{font-weight:700;font-size:24px;letter-spacing:-.06em}.tag{padding:7px 9px;border-radius:99px;background:var(--leaf);font-size:9px}h1{font-size:39px;line-height:.99;letter-spacing:-.06em;margin:40px 0 11px}.intro,.tiny{font-size:11px;line-height:1.65}.camera-card{display:block;position:relative;height:245px;margin:26px 0 15px;border:1px dashed #628b6b;border-radius:30px;overflow:hidden;background:linear-gradient(150deg,#d6efad,#a8dabe);text-align:center;color:white;padding-top:79px;cursor:pointer}.camera-card span{font-size:45px;text-shadow:0 2px 16px #3d7858}.camera-card small{display:block;margin-top:11px;font-size:9px}.camera-card input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.photo{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;display:none}.progress{display:none;padding:12px 14px;border-radius:16px;background:#eef3dc;font-size:10px;line-height:1.5}.manual{display:flex;gap:8px;margin-top:15px}.manual input{min-width:0;flex:1;border:1px solid #bfd0b8;border-radius:12px;padding:12px;background:white;font:11px 'DM Mono',monospace}.manual button,.again{border:0;border-radius:12px;background:var(--green);color:white;padding:0 13px;font:10px 'DM Mono',monospace}.error{display:none;margin-top:15px;padding:12px;border-radius:14px;background:#f9ded8;color:#74362b;font-size:10px;line-height:1.55}.result{display:none}.eyebrow{margin-top:35px;color:var(--green);font-size:9px;letter-spacing:.1em}.product{display:flex;gap:13px;align-items:center;margin-top:12px}.product img,.fallback{width:78px;height:78px;object-fit:contain;border-radius:16px;background:white}.fallback{display:grid;place-items:center;font-size:29px}.product h2{margin:0;font-size:25px;line-height:1.05;letter-spacing:-.04em}.product p{margin:5px 0 0;font-size:10px;line-height:1.5}.verdict{margin-top:20px;padding:19px;border-radius:24px;background:var(--ink);color:#fbf5e9}.verdict small{color:var(--sun);font-size:9px;letter-spacing:.08em}.verdict h3{margin:9px 0;font-size:23px;line-height:1.06}.verdict p{margin:0;font-size:10px;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.chip{padding:7px 9px;border-radius:99px;background:#315b48;font-size:9px}.chip.warn{background:#8d4439}.facts{margin-top:17px;padding:16px;border:1px solid #d7dfcb;border-radius:18px}.facts h3{margin:0 0 10px;font-size:18px}.facts dl{display:grid;grid-template-columns:1fr auto;gap:9px;margin:0;font-size:10px}.facts dt{opacity:.7}.facts dd{margin:0;font-weight:500}.ingredients{font-size:10px;line-height:1.65;margin:0}.again{height:40px;margin-top:18px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:76px;display:flex;justify-content:space-around;align-items:center;background:#fffaf0eF;border-top:1px solid #e2e8d8;font-size:10px}.active{color:var(--green);font-weight:bold}</style></head><body><main class="phone"><header><span class="logo">voedselwijs</span><span class="tag">jouw profiel</span></header><section id="start"><h1>Wat zit er<br>eigenlijk in?</h1><p class="intro">Maak een foto van de barcode op een voedingsmiddel. Voedselwijs herkent het product en vergelijkt het met jouw voorkeuren.</p><label class="camera-card"><img class="photo" id="photo" alt="Gekozen productfoto"><span id="cameraText">⌁<small>FOTOGRAFEER DE BARCODE</small></span><input id="camera" type="file" accept="image/*" capture="environment"></label><div class="progress" id="progress"></div><div class="manual"><input id="barcode" inputmode="numeric" placeholder="Of voer de barcode in"><button id="lookup">Zoek</button></div><p class="tiny">Profiel: vegetarisch · minder suiker · pinda-allergie.</p><div class="error" id="error"></div></section><section class="result" id="result"><div class="eyebrow">PRODUCT HERKEND</div><div class="product" id="product"></div><article class="verdict" id="verdict"></article><article class="facts" id="facts"></article><article class="facts"><h3>Ingrediënten</h3><p class="ingredients" id="ingredients"></p></article><button class="again" id="again">Nieuw product scannen</button></section></main><nav><span class="active">⌁<br>Scan</span><span>◫<br>Historie</span><span>☻<br>Profiel</span></nav><script>const $=s=>document.querySelector(s),state={vegetarian:true,lowSugar:true,allergy:'pinda'};function say(t){$('#progress').textContent=t;$('#progress').style.display='block'}function fail(t){$('#error').textContent=t;$('#error').style.display='block';$('#progress').style.display='none'}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function eNums(s=''){return [...new Set((s.match(/\bE\s?\d{3,4}[a-z]?\b/gi)||[]).map(x=>x.replace(/\s/g,'').toUpperCase()))]}async function product(code){say('Productgegevens worden opgehaald…');const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,image_front_small_url,ingredients_text,allergens_tags,nutriments,labels_tags,categories');if(!r.ok)throw Error('Productgegevens zijn niet bereikbaar.');const j=await r.json();if(j.status!==1)throw Error('Dit product is niet gevonden. Probeer een scherpere foto van de barcode.');show(j.product,code)}function show(p,code){const name=p.product_name||'Onbekend product',ings=p.ingredients_text||'',all=(p.allergens_tags||[]).join(' ').toLowerCase(),nuts=(p.nutriments||{}),ens=eNums(ings);const peanut=all.includes('pinda')||/pinda/i.test(ings),veg=!/(vlees|gelatine|vis|schaal|kip|rund)/i.test(ings),sugar=Number(nuts.sugars_100g);let title='Een prima keuze voor jouw profiel.';let body='Dit product sluit aan op je ingestelde voorkeuren.';let chips=['✓ product herkend'];if(peanut){title='Niet veilig voor jouw profiel.';body='Dit product bevat pinda of sporen van pinda. Vermijd het vanwege je pinda-allergie.';chips.push('! bevat pinda')}else if(state.lowSugar&&sugar>=10){title='Let op: relatief veel suiker.';body='Dit product bevat '+sugar.toLocaleString('nl-NL')+' g suiker per 100 g. Dat past minder goed bij minder suiker.';chips.push('! veel suiker')}else{chips.push('✓ geen pinda gedetecteerd');if(veg)chips.push('✓ vegetarisch')};if(ens.length)chips.push('E-nummers: '+ens.join(', '));$('#product').innerHTML=(p.image_front_small_url?'<img src="'+esc(p.image_front_small_url)+'" alt="'+esc(name)+'">':'<div class="fallback">🥫</div>')+'<div><h2>'+esc(name)+'</h2><p>'+esc(p.brands||'')+'<br>Barcode: '+esc(code)+'</p></div>';$('#verdict').innerHTML='<small>JOUW PERSOONLIJKE OORDEEL</small><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><div class="chips">'+chips.map(x=>'<span class="chip '+(x.startsWith('!')?'warn':'')+'">'+esc(x)+'</span>').join('')+'</div>';$('#facts').innerHTML='<h3>Voedingswaarden</h3><dl><dt>Calorieën</dt><dd>'+esc(nuts['energy-kcal_100g']??'—')+' kcal / 100 g</dd><dt>Suiker</dt><dd>'+esc(nuts.sugars_100g??'—')+' g / 100 g</dd><dt>Zout</dt><dd>'+esc(nuts.salt_100g??'—')+' g / 100 g</dd><dt>E-nummers</dt><dd>'+esc(ens.length?ens.join(', '):'geen gevonden')+'</dd></dl>';$('#ingredients').textContent=ings||'Ingrediënten zijn niet beschikbaar voor dit product.';$('#start').style.display='none';$('#result').style.display='block'}async function scan(file){$('#error').style.display='none';say('Barcode wordt gelezen…');const url=URL.createObjectURL(file),img=new Image;img.src=url;await img.decode();$('#photo').src=url;$('#photo').style.display='block';$('#cameraText').style.display='none';const reader=new ZXingBrowser.BrowserMultiFormatReader();const out=await reader.decodeFromImageElement(img);await product(out.getText())}$('#camera').onchange=async e=>{if(e.target.files[0])try{await scan(e.target.files[0])}catch(x){fail('Ik kon de barcode niet lezen. Maak een scherpere foto, met voldoende licht, of voer de barcode hieronder in.')}};$('#lookup').onclick=async()=>{const c=$('#barcode').value.trim();if(!/^\d{8,14}$/.test(c))return fail('Vul een barcode met 8 tot 14 cijfers in.');try{await product(c)}catch(x){fail(x.message)}};$('#again').onclick=()=>location.reload();</script></body></html>
