<!doctype html>
<html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voedselwijs</title><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#17352a;--paper:#f8f3e8;--green:#247255;--sun:#f5bf42}*{box-sizing:border-box}body{margin:0;background:#dce7d5;color:var(--ink);font-family:'DM Mono',monospace}.app{max-width:430px;min-height:100vh;margin:auto;padding:28px 21px 95px;background:var(--paper)}header{display:flex;justify-content:space-between}.logo,h1,h2,h3{font-family:Fraunces,serif}.logo{font-size:24px;font-weight:700}.tag{font-size:9px;color:var(--green)}h1{font-size:39px;line-height:1;margin:40px 0 12px}.intro{font-size:11px;line-height:1.65}.camera{display:block;position:relative;height:250px;margin:26px 0 15px;padding-top:88px;overflow:hidden;border:1px dashed #638a6d;border-radius:30px;background:linear-gradient(150deg,#d6efad,#a8dabe);color:#fff;text-align:center;font-size:45px}.camera small{display:block;margin-top:11px;font-size:9px}.camera input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.photo{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.message{display:none;margin-top:14px;padding:12px;border-radius:14px;background:#edf4dd;font-size:10px;line-height:1.55}.error{background:#f9ded8;color:#75362c}.manual{display:flex;gap:8px;margin-top:15px}.manual input{min-width:0;flex:1;padding:12px;border:1px solid #c2d1bc;border-radius:12px;background:#fff;font:11px 'DM Mono',monospace}.manual button,.again{border:0;border-radius:12px;background:var(--green);color:#fff;padding:0 13px;font:10px 'DM Mono',monospace}.result{display:none}.eyebrow{margin-top:35px;color:var(--green);font-size:9px;letter-spacing:.1em}.product{display:flex;gap:13px;align-items:center;margin-top:11px}.product img,.fallback{width:78px;height:78px;object-fit:contain;border-radius:16px;background:#fff}.fallback{display:grid;place-items:center;font-size:29px}.product h2{margin:0;font-size:25px;line-height:1.05}.product p,.ingredients{font-size:10px;line-height:1.6}.card{margin-top:17px;padding:16px;border:1px solid #d7dfcb;border-radius:18px}.card h3{margin:0 0 10px;font-size:18px}.card dl{display:grid;grid-template-columns:1fr auto;gap:9px;margin:0;font-size:10px}.card dt{opacity:.7}.card dd{margin:0;font-weight:500}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 9px;border-radius:99px;background:#d8efb2;font-size:9px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:76px;display:flex;justify-content:space-around;align-items:center;background:#fffaf0;border-top:1px solid #e2e8d8;font-size:10px}.active{color:var(--green);font-weight:bold}</style></head><body><main class="app"><header><span class="logo">voedselwijs</span><span class="tag">feitelijke informatie</span></header><section id="start"><h1>Wat zit er<br>eigenlijk in?</h1><p class="intro">Fotografeer de barcode of de ingrediëntenlijst. De app probeert eerst de barcode en leest daarna de cijfers en ingrediënten op de foto.</p><label class="camera"><img id="photo" class="photo" alt="Gekozen productfoto"><span id="cameraText">⌁<small>FOTOGRAFEER ETIKET OF BARCODE</small></span><input id="cameraInput" type="file" accept="image/*" capture="environment"></label><div id="message" class="message"></div><div class="manual"><input id="barcode" inputmode="numeric" placeholder="Barcode handmatig invoeren"><button id="lookup">Zoek</button></div><div id="error" class="message error"></div></section><section id="result" class="result"><div id="source" class="eyebrow"></div><div id="product" class="product"></div><article id="facts" class="card"></article><article class="card"><h3>Allergenen</h3><div id="allergens" class="chips"></div></article><article class="card"><h3>Ingrediënten</h3><p id="ingredients" class="ingredients"></p></article><button class="again" onclick="location.reload()">Nieuw product scannen</button></section></main><nav><span class="active">⌁<br>Scan</span><span>◫<br>Historie</span><span>☻<br>Info</span></nav><script>const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s){$('#message').textContent=s;$('#message').style.display='block'}function fail(s){$('#error').textContent=s;$('#error').style.display='block';$('#message').style.display='none'}function ens(s=''){return [...new Set((s.match(/\bE\s?\d{3,4}[a-z]?\b/gi)||[]).map(x=>x.replace(/\s/g,'').toUpperCase()))]}function eanOK(s){if(!/^\d{13}$/.test(s))return false;let n=0;for(let i=0;i<12;i++)n+=Number(s[i])*(i%2?3:1);return(10-n%10)%10===Number(s[12])}function eanFromText(t){for(const p of(t.match(/(?:\d[\s"'.,-]*){8,14}/g)||[])){const d=p.replace(/\D/g,'');if(eanOK(d))return d;if(d.length===12)for(let i=0;i<10;i++)if(eanOK(i+d))return i+d}return null}function show(name,ings='',n={},meta={}){const es=ens(ings),as=meta.allergens||[];$('#source').textContent=meta.source||'INGREDIËNTEN UIT FOTO';$('#product').innerHTML=(meta.image?'<img src="'+esc(meta.image)+'" alt="'+esc(name)+'">':'<div class="fallback">🥫</div>')+'<div><h2>'+esc(name)+'</h2><p>'+esc(meta.subtitle||'Geanalyseerd uit foto')+'</p></div>';$('#facts').innerHTML='<h3>Voedingswaarden</h3><dl><dt>Calorieën</dt><dd>'+esc(n['energy-kcal_100g']??'—')+' kcal / 100 g</dd><dt>Suiker</dt><dd>'+esc(n.sugars_100g??'—')+' g / 100 g</dd><dt>Zout</dt><dd>'+esc(n.salt_100g??'—')+' g / 100 g</dd><dt>E-nummers</dt><dd>'+esc(es.length?es.join(', '):'geen gevonden')+'</dd></dl>';$('#allergens').innerHTML=(as.length?as:['Niet beschikbaar']).map(x=>'<span class="chip">'+esc(String(x).replace(/^en:/,''))+'</span>').join('');$('#ingredients').textContent=ings||'Ingrediënten niet beschikbaar.';$('#start').style.display='none';$('#result').style.display='block'}async function lookup(c){say('Productgegevens worden opgehaald…');const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(c)+'.json?fields=product_name,brands,image_front_small_url,ingredients_text,nutriments,allergens_tags');const j=await r.json();if(j.status!==1)throw Error('Barcode herkend, maar dit product staat niet in de productdatabase.');const p=j.product;show(p.product_name||'Onbekend product',p.ingredients_text,p.nutriments,{source:'BARCODE HERKEND',image:p.image_front_small_url,subtitle:(p.brands||'')+' · '+c,allergens:p.allergens_tags})}async function ocr(f){say('Cijfers en ingrediënten op de foto worden gelezen…');const o=await Tesseract.recognize(f,'eng',{logger:m=>{if(m.status==='recognizing text')say('Foto wordt gelezen: '+Math.round(m.progress*100)+'%')}}),raw=o.data.text.replace(/\s+/g,' ').trim(),ean=eanFromText(raw);if(ean)return lookup(ean);if(raw.length<18)throw Error('Ik kon geen barcode of ingrediënten uit de foto lezen.');const h=raw.match(/(?:ingrediënten|ingredients)[\s:.-]*(.{20,900})/i);show('Product op basis van etiket',h?h[1]:raw,{}, {source:'INGREDIËNTEN UIT FOTO',subtitle:'Barcode niet herkend'})}async function scan(f){$('#error').style.display='none';const u=URL.createObjectURL(f);$('#photo').src=u;$('#photo').style.display='block';$('#cameraText').style.display='none';say('Barcode wordt gelezen…');try{const i=new Image;i.src=u;await i.decode();const r=new ZXingBrowser.BrowserMultiFormatReader();await lookup((await r.decodeFromImageElement(i)).getText())}catch(_){try{await ocr(f)}catch(e){fail(e.message)}}}$('#cameraInput').onchange=e=>{if(e.target.files[0])scan(e.target.files[0])};$('#lookup').onclick=()=>{const c=$('#barcode').value.trim();if(/^\d{8,14}$/.test(c))lookup(c).catch(e=>fail(e.message));else fail('Vul een barcode met 8 tot 14 cijfers in.')};</script></body></html>
